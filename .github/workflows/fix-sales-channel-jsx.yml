name: Fix sales channel JSX syntax

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JSX expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text()
          old = '''                          <td style={{ padding: 10 }}>\n                            ({{\n                    "楽天市場": "楽天",\n                    "Amazon": "アマ",\n                    "Yahoo!ショッピング": "ﾔﾌｼｮ",\n                    "メルカリ": "ﾒﾙｶﾘ",\n                  }[sale.sales_channel || ""] ?? (sale.sales_channel || "—"))}\n                          </td>'''
          new = '''                          <td style={{ padding: 10 }}>\n                            {({\n                              "楽天市場": "楽天",\n                              "Amazon": "アマ",\n                              "Yahoo!ショッピング": "ﾔﾌｼｮ",\n                              "メルカリ": "ﾒﾙｶﾘ",\n                            }[sale.sales_channel || ""] ?? (sale.sales_channel || "—"))}\n                          </td>'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Dashboard.tsx
          git commit -m 'fix: correct sales channel JSX expression'
          git push
          git rm .github/workflows/fix-sales-channel-jsx.yml
          git commit -m 'chore: remove one-time syntax fix workflow'
          git push
