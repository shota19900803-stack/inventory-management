name: Finish atomic shipping patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish patch and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text()
          old = '''      gross_profit: Number(data.gross_profit ?? ((unitPrice - Number(data.unit_cost ?? unitCost)) * quantity)),\n      notes: saleForm.notes.trim() || null,'''
          new = '''      gross_profit: Number(data.gross_profit ?? ((unitPrice - Number(data.unit_cost ?? unitCost)) * quantity)),\n      shipping_cost: shippingCost,\n      notes: saleForm.notes.trim() || null,'''
          if old not in s:
              raise SystemExit('newSale block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm -f .github/workflows/fix-atomic-shipping.yml .github/workflows/cleanup-atomic-shipping.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize atomic shipping patch"
          git push
