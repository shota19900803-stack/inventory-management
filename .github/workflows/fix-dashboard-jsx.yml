name: Fix Dashboard JSX Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix sibling JSX buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/Dashboard.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  ) : (\n    <button\n      type="button"\n      onClick={() => editSale(sale)}\n      style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff", color: "#111827", fontWeight: 700, cursor: "pointer", marginRight: 6 }}\n    >\n      編集\n    </button>\n    <button\n      type="button"\n      onClick={() => cancelSale(sale)}\n      style={{\n        padding: "6px 12px",\n        borderRadius: 8,\n        border: "1px solid #f0b4b4",\n        background: "#fff5f5",\n        color: "#b42318",\n        fontWeight: 700,\n        cursor: "pointer",\n      }}\n    >\n      取消\n    </button>\n  )}'''

          new = '''  ) : (\n    <>\n      <button\n        type="button"\n        onClick={() => editSale(sale)}\n        style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff", color: "#111827", fontWeight: 700, cursor: "pointer", marginRight: 6 }}\n      >\n        編集\n      </button>\n      <button\n        type="button"\n        onClick={() => cancelSale(sale)}\n        style={{\n          padding: "6px 12px",\n          borderRadius: 8,\n          border: "1px solid #f0b4b4",\n          background: "#fff5f5",\n          color: "#b42318",\n          fontWeight: 700,\n          cursor: "pointer",\n        }}\n      >\n        取消\n      </button>\n    </>\n  )}'''

          if old not in text:
              raise SystemExit('Target JSX block not found; refusing to modify the file.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Dashboard.tsx JSX fix applied.')
          PY

      - name: Verify Next.js production build
        run: |
          npm install
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-dashboard-jsx.yml
          git add components/Dashboard.tsx
          git commit -m "fix: wrap sale action buttons in JSX fragment"
          git push