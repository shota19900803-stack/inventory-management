name: Fix recent sales JSX syntax

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Dashboard JSX
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''{{\n                    "楽天市場": "楽天",\n                    "Amazon": "アマ",\n                    "Yahoo!ショッピング": "ﾔﾌｼｮ",\n                    "メルカリ": "ﾒﾙｶﾘ",\n                  }[sale.sales_channel || ""] ?? sale.sales_channel || "—"}'''
          new = '''({{\n                    "楽天市場": "楽天",\n                    "Amazon": "アマ",\n                    "Yahoo!ショッピング": "ﾔﾌｼｮ",\n                    "メルカリ": "ﾒﾙｶﾘ",\n                  }[sale.sales_channel || ""] ?? sale.sales_channel || "—")}'''
          if old not in s:
              raise SystemExit('target JSX block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx .github/workflows/fix-recent-sales-syntax.yml
          git commit -m "fix: repair recent sales JSX syntax"
          git rm .github/workflows/fix-recent-sales-syntax.yml
          git commit -m "chore: remove temporary fix workflow"
          git push