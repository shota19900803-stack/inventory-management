name: add-duplicate-jan-and-search
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-duplicate-jan-and-search.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply duplicate JAN flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('components/Dashboard.tsx')
          s=p.read_text()

          old='''    const result = editingProductId
      ? await supabase
          .from("products")
          .update(payload)
          .eq("id", editingProductId)
      : await supabase
          .from("products")
          .insert(payload);

    if (result.error) {
      setMessage(
        `保存エラー: ${result.error.message}`
      );
    } else {
      setMessage(
        editingProductId
          ? "商品を更新しました。"
          : "商品を登録しました。"
      );

      resetProductForm();
      await loadAll();
    }

    setSaving(false);'''
          new='''    // 新規登録時、同じJANが既に登録されている場合は重複登録せず、
    // その商品を選択した状態で仕入登録画面へ移動する。
    if (!editingProductId && payload.jan_code) {
      const normalizedJan = String(payload.jan_code).replace(/\\D/g, "");
      const existing = products.find(
        (product) => String(product.jan_code ?? "").replace(/\\D/g, "") === normalizedJan
      );

      if (existing) {
        setSaving(false);
        setMessage(`このJANは既に登録済みです：「${existing.name}」\n仕入登録画面を開きました。`);
        setPurchaseForm({
          ...initialPurchaseForm,
          product_id: existing.id,
          unit_cost: existing.cost_price == null ? "" : String(existing.cost_price),
        });
        setTab("purchases");
        setProductForm(initialProductForm);
        return;
      }
    }

    const result = editingProductId
      ? await supabase
          .from("products")
          .update(payload)
          .eq("id", editingProductId)
      : await supabase
          .from("products")
          .insert(payload);

    if (result.error) {
      setMessage(
        `保存エラー: ${result.error.message}`
      );
    } else {
      setMessage(
        editingProductId
          ? "商品を更新しました。"
          : "商品を登録しました。"
      );

      resetProductForm();
      await loadAll();
    }

    setSaving(false);'''
          if old not in s:
              raise SystemExit('saveProduct anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git diff --cached --check
          git commit -m "Handle duplicate JAN during product registration"
          git push
          rm -f .github/workflows/add-duplicate-jan-and-search.yml
          git add -A .github/workflows
          git commit -m "Remove temporary duplicate JAN workflow"
          git push