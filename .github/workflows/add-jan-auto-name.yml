name: Apply JAN auto lookup

on:
  push:
    branches: [main]
    paths:
      - "pages/api/jan-search.ts"

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Dashboard.tsx
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("components/Dashboard.tsx")
          text = path.read_text(encoding="utf-8")

          if "const janLookupRef = useRef(false);" in text:
              print("JAN lookup patch already applied")
              raise SystemExit(0)

          text = text.replace(
              'const controlsRef = useRef<any>(null);\nconst [scanning, setScanning] = useState(false);',
              'const controlsRef = useRef<any>(null);\nconst janLookupRef = useRef(false);\nconst [scanning, setScanning] = useState(false);',
              1,
          )

          start = text.index('const startJanScanner = () => {')
          end = text.index('  const monthSales = useMemo', start)

          new_block = r'''async function lookupProductByJan(jan: string) {
  if (janLookupRef.current) {
    return;
  }

  janLookupRef.current = true;
  setMessage("");
  setScannerMessage("商品情報を検索しています…");

  try {
    const localProduct = products.find(
      (product) =>
        String(product.jan_code ?? "").replace(/\D/g, "") === jan
    );

    if (localProduct) {
      setEditingProductId(localProduct.id);
      setProductForm({
        name: localProduct.name ?? "",
        jan_code: localProduct.jan_code ?? jan,
        sku: localProduct.sku ?? "",
        model_number: localProduct.model_number ?? "",
        brand: localProduct.brand ?? "",
        category: localProduct.category ?? "",
        stock_quantity: String(localProduct.stock_quantity ?? 0),
        cost_price:
          localProduct.cost_price == null
            ? ""
            : String(localProduct.cost_price),
        selling_price:
          localProduct.selling_price == null
            ? ""
            : String(localProduct.selling_price),
      });

      setMessage("登録済みの商品を読み込みました。");
      setScannerMessage(`読み取り成功：${jan}（登録済み商品）`);
      return;
    }

    const response = await fetch(
      `/api/jan-search?jan=${encodeURIComponent(jan)}`
    );

    const data = await response.json().catch(() => null);

    if (data?.found && data.product) {
      setEditingProductId(null);
      setProductForm((prev) => ({
        ...prev,
        jan_code: jan,
        name: data.product.name ?? prev.name,
        model_number:
          data.product.model_number ?? prev.model_number,
        brand: data.product.brand ?? prev.brand,
        category: data.product.category ?? prev.category,
      }));

      setMessage(
        `商品情報を自動取得しました（${data.product.source}）。`
      );
      setScannerMessage(`商品情報取得成功：${jan}`);
    } else {
      setProductForm((prev) => ({
        ...prev,
        jan_code: jan,
      }));
      setMessage(
        "JANは読み取れましたが、商品情報を取得できませんでした。商品名を入力してください。"
      );
      setScannerMessage(`JAN読み取り成功：${jan}`);
    }
  } catch (error) {
    console.error("JAN商品情報取得エラー:", error);

    setProductForm((prev) => ({
      ...prev,
      jan_code: jan,
    }));

    setMessage(
      "JANは読み取れましたが、商品情報の取得に失敗しました。"
    );
    setScannerMessage(`JAN読み取り成功：${jan}`);
  } finally {
    janLookupRef.current = false;
  }
}

const startJanScanner = () => {
  setScannerMessage(
    "カメラを起動しています…"
  );
  setScanning(true);
};

const closeJanScanner = () => {
  try {
    controlsRef.current?.stop();
  } catch {}

  controlsRef.current = null;
  scannerRef.current = null;

  setScanning(false);
};

useEffect(() => {
  if (!scanning) {
    return;
  }

  let cancelled = false;

  const startCamera = async () => {
    try {
      setScannerMessage(
        "カメラを起動しています…"
      );

      if (!videoRef.current) {
        setScannerMessage(
          "カメラ画面を準備しています…"
        );
        return;
      }

      const reader =
        new BrowserMultiFormatReader();

      scannerRef.current = reader;

      setScannerMessage(
        "JANコードをカメラに映してください"
      );

      const controls =
        await reader.decodeFromConstraints(
          {
            video: {
              facingMode: {
                ideal: "environment",
              },
            },
          },
          videoRef.current,
          (result, error) => {
            if (cancelled) {
              return;
            }

            if (result && !janLookupRef.current) {
              const jan =
                result
                  .getText()
                  .replace(/\D/g, "");

              console.log(
                "JANコード検出:",
                jan
              );

              if (jan.length === 13) {
                try {
                  controls.stop();
                } catch {}

                controlsRef.current = null;
                scannerRef.current = null;

                setScanning(false);
                void lookupProductByJan(jan);
              }
            }

            if (error) {
              console.log(
                "スキャン中:",
                error
              );
            }
          }
        );

      if (cancelled) {
        controls.stop();
        return;
      }

      controlsRef.current = controls;
    } catch (error) {
      console.error(
        "JANスキャンエラー:",
        error
      );

      if (!cancelled) {
        setScannerMessage(
          "カメラを起動できませんでした。"
        );

        alert(
          "カメラを起動できませんでした。\n\n" +
          "Safariのカメラ使用許可を確認して、もう一度お試しください。"
        );

        setScanning(false);
      }
    }
  };

  startCamera();

  return () => {
    cancelled = true;

    try {
      controlsRef.current?.stop();
    } catch {}

    controlsRef.current = null;
    scannerRef.current = null;

    if (videoRef.current) {
      videoRef.current.pause();
      videoRef.current.srcObject = null;
    }
  };
}, [scanning, products]);
'''

          text = text[:start] + new_block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit Dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No Dashboard changes"
            exit 0
          fi
          git commit -m "Add JAN auto product lookup"
          git push
