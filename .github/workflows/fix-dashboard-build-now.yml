name: Fix Dashboard build now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize sale action JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/Dashboard.tsx')
          text = path.read_text(encoding='utf-8')

          old = text
          text = text.replace('      <><button\n', '      <button\n')
          text = text.replace('      </button></>\n    </>\n  )}', '      </button>\n    </>\n  )}')

          if text == old:
              raise SystemExit('No JSX normalization target found; refusing to create a pointless commit.')

          path.write_text(text, encoding='utf-8')
          print('Dashboard sale action JSX normalized.')
          PY

      - name: Verify production build
        run: |
          npm install
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git rm .github/workflows/fix-dashboard-build-now.yml
          git commit -m "fix: normalize Dashboard sale action JSX"
          git push
