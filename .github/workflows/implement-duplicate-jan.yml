name: implement-duplicate-jan
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("components/Dashboard.tsx"); s=p.read_text(); marker="    const result = editingProductId"; insert=base64.b64decode("").decode(); 
if "const normalizedJan = String(payload.jan_code)" not in s:
  assert marker in s, "marker not found"; p.write_text(s.replace(marker, insert+marker, 1)); print("patched")
else: print("already patched")'
          sha=$(gh api repos/shota19900803-stack/inventory-management/contents/components/Dashboard.tsx --jq .sha)
          content=$(base64 -w0 components/Dashboard.tsx)
          gh api --method PUT repos/shota19900803-stack/inventory-management/contents/components/Dashboard.tsx -f message='Add duplicate JAN purchase flow' -f content="$content" -f sha="$sha" >/dev/null
