name: implement-duplicate-jan
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply duplicate JAN handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("components/Dashboard.tsx")
          s = p.read_text()

          marker = '''    const result = editingProductId
      ? await supabase
          .from("products")
          .update(payload)
          .eq("id", editingProductId)
      : await supabase
          .from("products")
          .insert(payload);
'''

          insert = '''    // 新規商品登録時、同じJANが既に登録されていれば重複登録せず、
    // 既存商品を選択した状態で仕入登録画面へ移動する。
    if (!editingProductId && payload.jan_code) {
      const normalizedJan = String(payload.jan_code).replace(/\\D/g, "");
      const existing = products.find(
        (product) =>
          String(product.jan_code ?? "").replace(/\\D/g, "") === normalizedJan
      );

      if (existing) {
        setSaving(false);
        setMessage(
          `このJANは既に登録済みです：「${existing.name}」\\n仕入登録画面を開きました。`
        );
        setPurchaseForm({
          ...initialPurchaseForm,
          product_id: existing.id,
          unit_cost:
            existing.cost_price == null
              ? ""
              : String(existing.cost_price),
        });
        setTab("purchases");
        setEditingProductId(null);
        setProductForm(initialProductForm);
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
    }

'''

          if "const normalizedJan = String(payload.jan_code)" not in s:
              if marker not in s:
                  raise SystemExit("saveProduct marker not found")
              s = s.replace(marker, insert + marker, 1)
              p.write_text(s)
          else:
              print("duplicate JAN handling already present")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          rm -f .github/workflows/implement-duplicate-jan.yml
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "Add duplicate JAN purchase flow"
          git push
