name: Refine recent sales columns

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine recent sales columns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/Dashboard.tsx')
          s = p.read_text()
          marker = '<h2 style={{ margin: 0 }}>最近の売上</h2>'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('recent sales marker not found')
          end = s.find('</section>', start)
          if end < 0:
              raise SystemExit('recent sales section end not found')
          section = s[start:end]

          table_pos = section.find('<table')
          if table_pos < 0:
              raise SystemExit('recent sales table not found')
          table_end = section.find('>', table_pos)
          if table_end < 0:
              raise SystemExit('recent sales table opening end not found')
          table_open = section[table_pos:table_end + 1]
          if '<colgroup>' not in table_open:
              table_open = '''<table
                  style={{
                    width: "100%",
                    minWidth: 1240,
                    tableLayout: "fixed",
                    borderCollapse: "collapse",
                  }}
                >
                  <colgroup>
                    <col style={{ width: 95 }} />
                    <col style={{ width: 280 }} />
                    <col style={{ width: 75 }} />
                    <col style={{ width: 180 }} />
                    <col style={{ width: 55 }} />
                    <col style={{ width: 105 }} />
                    <col style={{ width: 125 }} />
                    <col style={{ width: 90 }} />
                    <col style={{ width: 105 }} />
                    <col style={{ width: 130 }} />
                  </colgroup>'''
              section = section[:table_pos] + table_open + section[table_end + 1:]
          else:
              section = section.replace('minWidth: 1340,', 'minWidth: 1240,', 1)

          # Date: 2026-09-08 -> 26/09/08.
          section, n = re.subn(r'\{sale\.sale_date\}', '{String(sale.sale_date ?? "").slice(2).replace(/-/g, "/")}', section, count=1)
          if n != 1 and 'String(sale.sale_date ?? "").slice(2).replace' not in section:
              raise SystemExit('recent sales date cell not found')

          # Shorten common sales channels.
          new_channel_expr = '''{{
                              "楽天市場": "楽天",
                              "Amazon": "アマ",
                              "Yahoo!ショッピング": "ﾔﾌｼｮ",
                              "メルカリ": "ﾒﾙｶﾘ",
                            }[sale.sales_channel || ""] ?? sale.sales_channel || "—"}'''
          section, n = re.subn(r'\{sale\.sales_channel\s*\|\|\s*"—"\}', lambda m: new_channel_expr, section, count=1)
          if n != 1 and '"楽天市場": "楽天"' not in section:
              raise SystemExit('recent sales channel cell not found')

          s = s[:start] + section + s[end:]
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: compact recent sales date channel and order columns"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/refine-recent-sales-columns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary recent sales workflow"
          git push
