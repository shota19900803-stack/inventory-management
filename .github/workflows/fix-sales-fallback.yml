name: Fix sales fallback

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nullish fallback syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text()
          old = '?? sale.sales_channel || "—")'
          new = '?? (sale.sales_channel || "—"))'
          if old not in s:
              raise SystemExit('target syntax not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/Dashboard.tsx
          git commit -m 'fix: parenthesize sales channel fallback'
          git push
