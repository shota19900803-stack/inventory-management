name: Fix recent sales layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve recent sales table readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/Dashboard.tsx')
          s = p.read_text()

          if 'minWidth: 1340' not in s:
              pattern = r'(<table\s+style=\{\{\s*width:\s*"100%",\s*)borderCollapse:\s*"collapse",\s*\}\}\s*>'
              replacement = r'''\1minWidth: 1340,
                    tableLayout: "fixed",
                    borderCollapse: "collapse",
                  }}
                >
                  <colgroup>
                    <col style={{ width: 95 }} />
                    <col style={{ width: 280 }} />
                    <col style={{ width: 95 }} />
                    <col style={{ width: 220 }} />
                    <col style={{ width: 65 }} />
                    <col style={{ width: 115 }} />
                    <col style={{ width: 135 }} />
                    <col style={{ width: 100 }} />
                    <col style={{ width: 115 }} />
                    <col style={{ width: 150 }} />
                  </colgroup>'''
              s2, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('recent sales table opening not found')
              s = s2

          if 'title={productMap[sale.product_id]?.name ?? "商品不明"}' not in s:
              pattern = r'''<td style=\{\{ padding: 10 \}\}>\s*\{productMap\[\s*sale\.product_id\s*\]\?\.name \?\?\s*"商品不明"\}\s*</td>'''
              replacement = '''<td
                            style={{
                              padding: "8px 10px",
                              maxWidth: 280,
                              overflow: "hidden",
                              textOverflow: "ellipsis",
                              whiteSpace: "nowrap",
                              verticalAlign: "middle",
                            }}
                            title={productMap[sale.product_id]?.name ?? "商品不明"}
                          >
                            {productMap[sale.product_id]?.name ?? "商品不明"}
                          </td>'''
              s2, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('recent sales product cell not found')
              s = s2

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: make recent sales table easier to scan"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-recent-sales-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary layout workflow"
          git push
