name: Fix recent sales layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve recent sales table readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text()

          old = '''                <table
                  style={{
                    width: "100%",
                    borderCollapse:
                      "collapse",
                  }}
                >'''
          new = '''                <table
                  style={{
                    width: "100%",
                    minWidth: 1340,
                    tableLayout: "fixed",
                    borderCollapse: "collapse",
                  }}
                >
                  <colgroup>
                    <col style={{ width: 95 }} />
                    <col style={{ width: 280 }} />
                    <col style={{ width: 95 }} />
                    <col style={{ width: 220 }} />
                    <col style={{ width: 65 }} />
                    <col style={{ width: 115 }} />
                    <col style={{ width: 135 }} />
                    <col style={{ width: 100 }} />
                    <col style={{ width: 115 }} />
                    <col style={{ width: 150 }} />
                  </colgroup>'''
          if old not in s:
              raise SystemExit('recent sales table opening not found')
          s = s.replace(old, new, 1)

          old = '''                          <td style={{ padding: 10 }}>
                            {productMap[
                              sale.product_id
                            ]?.name ??
                              "商品不明"}
                          </td>'''
          new = '''                          <td
                            style={{
                              padding: "8px 10px",
                              maxWidth: 280,
                              overflow: "hidden",
                              textOverflow: "ellipsis",
                              whiteSpace: "nowrap",
                              verticalAlign: "middle",
                            }}
                            title={productMap[sale.product_id]?.name ?? "商品不明"}
                          >
                            {productMap[sale.product_id]?.name ?? "商品不明"}
                          </td>'''
          if old not in s:
              raise SystemExit('recent sales product cell not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: make recent sales table easier to scan"
          git push

      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-recent-sales-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary layout workflow"
          git push
