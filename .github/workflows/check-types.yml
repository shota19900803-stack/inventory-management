name: check-types
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-types.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/check-types.yml
          git add -A .github/workflows/check-types.yml
          git commit -m "Remove temporary type check workflow" || true
          git push || true