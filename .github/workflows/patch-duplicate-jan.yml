name: patch-duplicate-jan
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-duplicate-jan.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dashboard
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('components/Dashboard.tsx')
          s = p.read_text()
          marker = '''    const result = editingProductId'''
          insert = '''    if (!editingProductId && payload.jan_code) {
      const normalizedJan = String(payload.jan_code).replace(/\\D/g, "");
      const existing = products.find((product) =>
        String(product.jan_code ?? "").replace(/\\D/g, "") === normalizedJan
      );
      if (existing) {
        setSaving(false);
        setMessage(`このJANは既に登録済みです：「${existing.name}」\\n仕入登録画面を開きました。`);
        setPurchaseForm({
          ...initialPurchaseForm,
          product_id: existing.id,
          unit_cost: existing.cost_price == null ? "" : String(existing.cost_price),
        });
        setTab("purchases");
        setProductForm(initialProductForm);
        return;
      }
    }

'''
          if marker not in s:
              raise SystemExit('marker not found')
          if 'const normalizedJan = String(payload.jan_code)' in s:
              raise SystemExit('already patched')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git diff --cached --check
          git commit -m "Handle duplicate JAN during product registration"
          git push
          rm -f .github/workflows/patch-duplicate-jan.yml
          git add -A .github/workflows
          git commit -m "Remove temporary duplicate JAN workflow"
          git push