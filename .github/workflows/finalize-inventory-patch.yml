name: finalize-inventory-patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-inventory-patch.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and clean up
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          wf=Path('.github/workflows/patch-inventory-management.yml').read_text()
          a=wf.index("          python3 <<'PY'") + len("          python3 <<'PY'\n")
          b=wf.index("          PY\n          git checkout")
          exec(compile(textwrap.dedent(wf[a:b]), 'patch-script', 'exec'))
          PY
          git rm -f README.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git diff --cached --check
          git commit -m "Add history editing and purchase JAN scanner"
          git push
          rm -f .github/workflows/patch-inventory-management.yml .github/workflows/repair-inventory-patch.yml .github/workflows/finalize-inventory-patch.yml
          git add -A .github/workflows
          git commit -m "Remove temporary patch workflows"
          git push