name: Fix atomic shipping

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shipping flow
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('components/Dashboard.tsx')
          s = dashboard.read_text()

          old = '''          p_notes:\n            saleForm.notes.trim() || null,\n        }\n      );'''
          new = '''          p_notes:\n            saleForm.notes.trim() || null,\n\n          p_shipping_cost:\n            shippingCost,\n        }\n      );'''
          if old not in s:
              raise SystemExit('Dashboard RPC argument block not found')
          s = s.replace(old, new, 1)

          old_block = '''    // ==========================================\n    // 送料保存\n    // ==========================================\n    let saleId = data?.sale_id ?? data?.id ?? null;\n\n    if (!saleId) {\n      const { data: latestSale } = await supabase\n        .from("sales_history")\n        .select("id")\n        .eq("product_id", saleForm.product_id)\n        .eq("sale_date", saleForm.sale_date)\n        .order("created_at", { ascending: false })\n        .limit(1)\n        .maybeSingle();\n      saleId = latestSale?.id ?? null;\n    }\n\n    if (saleId) {\n      const { error: shippingError } = await supabase.rpc("set_sale_shipping_cost", {\n        p_sale_id: saleId,\n        p_shipping_cost: shippingCost,\n      });\n      if (shippingError) {\n        setMessage(`送料の保存に失敗しました：${shippingError.message}`);\n        return;\n      }\n    }\n\n'''
          if old_block not in s:
              raise SystemExit('Dashboard post-save shipping block not found')
          s = s.replace(old_block, '', 1)

          old_shipping = '''  const shippingCost = Number(\n    saleForm.shipping_cost || 0\n  );'''
          new_shipping = '''  // 発送費パネルはDashboardのsaleFormとは別コンポーネントで管理している。\n  // 登録時点の自動計算額をDOMから取得し、register_saleへ直接渡して1回の登録で保存する。\n  const shippingPanel = typeof document !== "undefined"\n    ? document.querySelector("[data-sales-shipping-panel]") as HTMLElement | null\n    : null;\n  const panelShippingCost = shippingPanel?.getAttribute("data-shipping-cost");\n  const shippingCost = panelShippingCost != null && panelShippingCost !== ""\n    ? Number(panelShippingCost)\n    : Number(saleForm.shipping_cost || 0);'''
          if old_shipping not in s:
              raise SystemExit('Dashboard shippingCost declaration not found')
          s = s.replace(old_shipping, new_shipping, 1)
          dashboard.write_text(s)

          shipping = Path('components/SalesShippingEnhancement.tsx')
          s = shipping.read_text()
          old = '''    <section data-sales-shipping-panel="true" style={{ marginTop: 18, padding: 18, borderRadius: 16, background: "#f0f9ff", border: "1px solid #bae6fd" }}>'''
          new = '''    <section\n      data-sales-shipping-panel="true"\n      data-shipping-cost={String(Math.max(0, Number(amount || 0)))}\n      style={{ marginTop: 18, padding: 18, borderRadius: 16, background: "#f0f9ff", border: "1px solid #bae6fd" }}\n    >'''
          if old not in s:
              raise SystemExit('Shipping panel section not found')
          s = s.replace(old, new, 1)
          shipping.write_text(s)
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx components/SalesShippingEnhancement.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: save shipping cost with sale registration"
          git push
