name: Fix sales history purchase cost display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix purchase cost display
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/Dashboard.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''                          <td style={{ padding: 10, textAlign: "right" }} data-purchase-cost-cell="true">\n                            {yen(sale.unit_cost)}\n                          </td>'''
          new = '''                          <td style={{ padding: 10, textAlign: "right" }} data-purchase-cost-cell="true">\n                            {yen(sale.total_cost)}\n                          </td>'''
          if old not in text:
              raise SystemExit('Target sales-history purchase-cost display block was not found.')
          text = text.replace(old, new, 1)
          text = text.replace('''                      <th style={{ padding: 10 }} data-purchase-cost-header="true">\n                        仕入値\n                      </th>''', '''                      <th style={{ padding: 10 }} data-purchase-cost-header="true">\n                        仕入値合計\n                      </th>''', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx
          git rm .github/workflows/fix-sale-cost-display.yml
          git commit -m "Fix sales history total purchase cost display"
          git push