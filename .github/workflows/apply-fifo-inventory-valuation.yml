name: Apply FIFO inventory valuation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: apply FIFO inventory valuation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply FIFO valuation fix
        run: node scripts/apply-fifo-inventory-valuation.js

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Dashboard.tsx scripts/apply-fifo-inventory-valuation.js .github/workflows/apply-fifo-inventory-valuation.yml
          git rm .github/workflows/apply-fifo-inventory-valuation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: apply FIFO inventory valuation"
            git push
          fi
